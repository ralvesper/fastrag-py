services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fastrag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fastrag
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_DIMS: 1536
      CHAT_MODEL: gemini-2.5-flash-lite
    volumes:
      - /home/rodrigo/dev/sodexo/gitlab/rodrigo.pereira.ext/highonline/highonline-docs:/home/rodrigo/dev/sodexo/gitlab/rodrigo.pereira.ext/highonline/highonline-docs:ro
      - /home/rodrigo/dev/sodexo/gitlab/pluxee-tooling/plx-docs:/home/rodrigo/dev/sodexo/gitlab/pluxee-tooling/plx-docs:ro
      - /home/rodrigo/dev/sodexo/gitlab/core-backoffice/pluxee-issues:/home/rodrigo/dev/sodexo/gitlab/core-backoffice/pluxee-issues:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
